<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xyz = new XMLHttpRequest();
    xyz.open('GET', requestUrl);
    xyz.onreadystatechange = function(){
        console.log(xyz.readyState);
        if(xyz.readyState === 4){
            const data = JSON.parse(this.responseText);
            console.log(data.followers);            
        }
    }

    //every data is in JSON format , but every data come si string so to convert the string into json
    // we use JSON.parse(that string)
    //jason.formatter.org is used to see and study the API

    xyz.send();
